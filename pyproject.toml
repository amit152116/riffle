[project]
name = "riffle"
version = "0.1.0"
description = "Local music library scanner and duplicate detector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
    "mutagen>=1.47",
    "pyacoustid>=1.3",
    # essentia-tensorflow is Essentia built with TensorFlow support, which the
    # embedding models need; it provides the same `essentia` module. The
    # released builds are dev versions, so the lower bound names one.
    "essentia-tensorflow>=2.1b6.dev1389",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.scripts]
riffle = "riffle.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
